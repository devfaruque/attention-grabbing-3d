<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE GREAT BREAKOUT — Farmart 3D Animation Demo</title>
<!-- DEMO ONLY: Tailwind is used only for the demo storefront. The animation itself uses isolated gb- CSS. -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<!-- ===================== ANIMATION CSS (copy into Botble "Custom CSS") ===================== -->
<style id="gb-css">
#gb-root{position:fixed;inset:0;z-index:2147483000;display:none;overflow:hidden;opacity:0;transition:opacity .45s ease;overscroll-behavior:contain;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#gb-root.gb-on{display:block}
#gb-root.gb-vis{opacity:1}
#gb-root *{box-sizing:border-box}
#gb-cv,#gb-sc{position:absolute;inset:0;width:100%;height:100%}
#gb-sc{perspective:1000px;transform-style:preserve-3d;pointer-events:none}
.gb-o{position:absolute;opacity:0;transform-style:preserve-3d;will-change:transform,opacity}
.gb-f svg{display:block;width:100%;height:100%;overflow:visible}
.gb-done .gb-f{animation:gb-fl 4.2s ease-in-out infinite alternate}
@keyframes gb-fl{to{transform:translateY(-7px) rotate(2.5deg)}}
#gb-card{position:absolute;z-index:3;left:5vw;top:50%;width:min(440px,42vw);padding:28px;background:#FFF9EF;color:#155D35;border-radius:20px;box-shadow:0 34px 60px -22px rgba(0,0,0,.6),0 0 0 1px rgba(21,93,53,.1);opacity:0;visibility:hidden;transform:translateY(-44%);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1),visibility 0s .9s}
#gb-root.gb-show #gb-card{opacity:1;visibility:visible;transform:translateY(-50%);transition-delay:0s}
.gb-tag{display:inline-flex;align-items:center;gap:8px;margin:0;padding:6px 12px;border-radius:99px;background:#155D35;color:#FFF9EF;font-size:12px;font-weight:700;letter-spacing:.08em}
.gb-tag:before{content:"";width:8px;height:8px;border-radius:50%;background:#F49B38}
#gb-h{margin:14px 0 10px;font-size:clamp(28px,3.4vw,44px);line-height:1.05;font-weight:800;letter-spacing:-.02em;color:#155D35}
.gb-sub{margin:0;font-size:16px;line-height:1.5;color:#33453a}
.gb-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.gb-b1,.gb-b2{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:12px;font-size:14px;font-weight:700;letter-spacing:.03em;text-decoration:none;transition:transform .2s ease}
.gb-b1{background:#1c7d3c;color:#fff}
.gb-b2{border:2px solid #155D35;color:#155D35;background:transparent}
.gb-b1:hover,.gb-b2:hover{transform:translateY(-2px)}
#gb-root a:focus-visible,#gb-root button:focus-visible{outline:3px solid #F49B38;outline-offset:2px}
#gb-bar{position:absolute;z-index:5;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px}
#gb-bar button{min-height:44px;min-width:44px;padding:0 14px;border:0;border-radius:99px;background:#FFF9EF;color:#155D35;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#gb-x{font-size:18px!important}
@media(max-width:700px){
#gb-card{left:12px;right:12px;width:auto;top:auto;bottom:max(12px,env(safe-area-inset-bottom));padding:18px;transform:translateY(30px)}
#gb-root.gb-show #gb-card{transform:none}
#gb-h{font-size:26px;margin:10px 0 8px}
.gb-sub{font-size:14px}
.gb-b1,.gb-b2{flex:1 1 140px}
#gb-bar button{padding:0 10px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){.gb-done .gb-f{animation:none}#gb-root,#gb-card{transition-duration:.01s}}
</style>
</head>

<body>
<!-- ===================== DEMO ONLY: Farmart-style storefront (not part of the install) ===================== -->

  <p class="bg-[#155D35] px-3 py-2 text-center text-xs text-[#FFF9EF]">Demo storefront for the animation preview</p>
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-3">
      <a href="#" class="text-xl font-extrabold text-[#155D35]">Farm<span class="text-[#F49B38]">art</span></a>
      <form role="search" class="flex min-w-0 flex-1" onsubmit="return false">
        <input aria-label="Search products" placeholder="Search fresh groceries" class="w-full min-w-0 rounded-l-lg border border-slate-300 px-3 py-2 text-sm">
        <button class="rounded-r-lg bg-[#1c7d3c] px-4 text-sm font-semibold text-white">Search</button>
      </form>
      <button class="relative rounded-full border border-slate-200 px-3 py-2 text-sm" aria-label="Cart, 0 items">Cart <span class="ml-1 rounded-full bg-[#F49B38] px-1.5 text-xs font-bold text-[#155D35]">0</span></button>
    </div>
    <nav aria-label="Categories" class="mx-auto flex max-w-6xl gap-5 overflow-x-auto whitespace-nowrap px-4 pb-3 text-sm font-medium text-slate-600">
      <a href="#shop">Vegetables</a><a href="#shop">Fruit</a><a href="#shop">Dairy &amp; eggs</a><a href="#shop">Bakery</a><a href="#shop">Pantry</a><a href="#shop">Organic</a>
    </nav>
  </header>
  <section class="bg-[#FFF9EF]">
    <div class="mx-auto grid max-w-6xl items-center gap-6 px-4 py-10 md:grid-cols-2 md:py-16">
      <div>
        <p class="text-sm font-bold text-[#279447]">Fresh every day</p>
        <h1 class="mt-2 text-4xl font-extrabold leading-tight text-[#155D35] md:text-5xl">Groceries picked for your table</h1>
        <p class="mt-3 max-w-md text-slate-600">Browse vegetables, fruit and pantry staples in a clean, fast storefront.</p>
        <a href="#shop" class="mt-6 inline-block rounded-lg bg-[#1c7d3c] px-6 py-3 font-bold text-white">Shop now</a>
      </div>
      <div class="flex justify-center gap-2" aria-hidden="true" id="gb-hero-art"></div>
    </div>
  </section>
  <section id="shop" class="mx-auto max-w-6xl px-4 py-10">
    <h2 class="mb-5 text-2xl font-extrabold text-[#155D35]">Fresh picks</h2>
    <div id="gb-grid" class="grid grid-cols-2 gap-4 md:grid-cols-4"></div>
  </section>
  <footer class="border-t border-slate-200 px-4 py-8 text-center text-sm text-slate-500">Demo content only. Product names are placeholders.</footer>
</div>
<button id="gb-demo" class="fixed bottom-4 left-4 z-40 min-h-11 rounded-full bg-[#F49B38] px-5 text-sm font-bold text-[#155D35] shadow-lg" style="bottom:max(1rem,env(safe-area-inset-bottom))">▶ Play animation</button>
